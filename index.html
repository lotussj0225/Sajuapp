<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>사주나침반</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="input-panel" aria-label="사주 입력">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">
            <span></span>
          </div>
          <div>
            <h1>사주나침반</h1>
            <p>양력 기준 사주 리딩</p>
          </div>
        </div>

        <form id="birthForm" class="birth-form">
          <label>
            <span>이름</span>
            <input id="name" type="text" autocomplete="name" placeholder="예: 민준" />
          </label>

          <div class="field-grid">
            <label>
              <span>생년월일</span>
              <input id="birthDate" type="date" required />
            </label>

            <label>
              <span>태어난 시간</span>
              <input id="birthTime" type="time" value="12:00" required />
            </label>
          </div>

          <div class="field-grid">
            <label>
              <span>성별</span>
              <select id="gender">
                <option value="neutral">선택 안 함</option>
                <option value="female">여성</option>
                <option value="male">남성</option>
              </select>
            </label>

            <label>
              <span>관심 운</span>
              <select id="focus">
                <option value="overall">전체</option>
                <option value="career">일/돈</option>
                <option value="love">연애/관계</option>
                <option value="mind">마음/성향</option>
              </select>
            </label>
          </div>

          <label class="switch-row">
            <input id="yajaTime" type="checkbox" checked />
            <span>
              <strong>야자시 적용</strong>
              <em>23:30-23:59 출생은 야자시 기준으로 계산</em>
            </span>
          </label>

          <button class="primary-button" type="submit">
            <span aria-hidden="true">✦</span>
            사주 보기
          </button>
        </form>

        <div class="mini-note">
          <strong>현재 버전</strong>
          <span>양력 날짜, 24절기 근사, 야자시 23:30 기준으로 풀이합니다.</span>
        </div>
      </section>

      <section class="result-panel" aria-label="사주 결과">
        <div class="sky-map" aria-hidden="true">
          <div class="orbit orbit-one"></div>
          <div class="orbit orbit-two"></div>
          <div class="orbit orbit-three"></div>
          <div class="center-dot"></div>
          <span class="star star-a"></span>
          <span class="star star-b"></span>
          <span class="star star-c"></span>
          <span class="star star-d"></span>
        </div>

        <div class="result-header">
          <div>
            <p id="resultKicker">오늘의 흐름까지 함께 보는</p>
            <h2 id="resultTitle">생년월일시를 입력해 주세요</h2>
          </div>
          <div id="dayMasterBadge" class="day-master-badge">일간</div>
        </div>

        <div id="pillarGrid" class="pillar-grid" aria-live="polite">
          <div class="pillar-title">년주</div>
          <div class="pillar-title">월주</div>
          <div class="pillar-title">일주</div>
          <div class="pillar-title">시주</div>
          <article class="palja-cell muted">
            <span>천간</span>
            <strong>--</strong>
          </article>
          <article class="palja-cell muted">
            <span>천간</span>
            <strong>--</strong>
          </article>
          <article class="palja-cell muted">
            <span>천간</span>
            <strong>--</strong>
          </article>
          <article class="palja-cell muted">
            <span>천간</span>
            <strong>--</strong>
          </article>
          <article class="palja-cell muted">
            <span>지지</span>
            <strong>--</strong>
          </article>
          <article class="palja-cell muted">
            <span>지지</span>
            <strong>--</strong>
          </article>
          <article class="palja-cell muted">
            <span>지지</span>
            <strong>--</strong>
          </article>
          <article class="palja-cell muted">
            <span>지지</span>
            <strong>--</strong>
          </article>
        </div>

        <section class="daeun-panel" aria-label="대운">
          <div class="section-title">
            <h3>대운</h3>
            <span id="daeunSummary">성별 기준 계산</span>
          </div>
          <div id="daeunList" class="daeun-list" aria-live="polite"></div>
          <p id="daeunNote" class="daeun-note">대운은 월주를 기준으로 10년 단위 흐름을 봅니다.</p>
        </section>

        <div class="analysis-layout">
          <section class="balance-panel" aria-label="오행 균형">
            <div class="section-title">
              <h3>오행 균형</h3>
              <span id="balanceSummary">기다리는 중</span>
            </div>
            <div id="elementBars" class="element-bars"></div>
          </section>

          <section class="reading-panel" aria-label="사주 풀이">
            <div class="tabs" role="tablist" aria-label="풀이 항목">
              <button class="tab active" type="button" data-tab="overall">총운</button>
              <button class="tab" type="button" data-tab="career">일</button>
              <button class="tab" type="button" data-tab="love">관계</button>
              <button class="tab" type="button" data-tab="timing">시기</button>
            </div>
            <div id="readingText" class="reading-text">
              입력 후 사주팔자와 오행의 강약을 바탕으로 풀이가 표시됩니다.
            </div>
          </section>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
